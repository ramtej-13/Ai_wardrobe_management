<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Wardrobe — Dark Couture Brutalism</title>
  <!-- Google Fonts Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- React and Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Color and Design Tokens */
    :root {
      --bg: #080810;
      --surface: #10101E;
      --surface-2: #16162A;
      --border: #1E1A38;
      --border-strong: #2D2850;
      --accent: #A855F7;
      --accent-dim: rgba(168, 85, 247, 0.08); /* 8% opacity */
      --accent-mid: #7C3AED;
      --text-primary: #E8E0FF;
      --text-secondary: #6B5F9E;
      --text-ghost: #2D2850;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }

    /* Global Rules */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: none; /* Hide scrollbar for Firefox */
    }
    *::-webkit-scrollbar {
      display: none; /* Hide scrollbar for Chrome/Safari */
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      letter-spacing: -0.01em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 60px 0;
    }

    /* Main Scroll Container representing one tall React page */
    .app-viewport-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 390px;
    }

    /* Screen Enclosure: iPhone 15 Pro Dimensions */
    .mobile-screen-enclosure {
      width: 390px;
      height: 844px;
      min-height: 844px;
      background-color: var(--bg);
      border: 0.5px solid var(--border);
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Screen Label Separator */
    .screen-separator-container {
      width: 390px;
      text-align: center;
      position: relative;
      margin: 40px 0 20px 0;
    }
    .screen-separator-line {
      width: 100%;
      height: 0.5px;
      background-color: var(--border);
      position: absolute;
      top: 50%;
      left: 0;
      z-index: 1;
    }
    .screen-separator-label {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: 7px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-ghost);
      background-color: var(--bg);
      padding: 0 16px;
      position: relative;
      z-index: 2;
      display: inline-block;
    }

    /* Typography Classes */
    .font-display-hero {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 48px;
      letter-spacing: -0.02em;
      line-height: 1.0;
    }
    .font-title-header {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 32px;
      letter-spacing: -0.01em;
      line-height: 1.0;
    }
    .font-heading-mono {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .font-label-mono {
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .font-micro-mono {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .font-body-text {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: -0.01em;
      line-height: 1.6;
    }
    .font-caption-text {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0em;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Animations */
    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1.0; }
    }
    .animate-pulse-opacity {
      animation: pulseOpacity 1.2s ease-in-out infinite;
    }

    @keyframes laserSweep {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }
    .scanning-laser-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: var(--accent);
      z-index: 10;
      animation: laserSweep 1.8s ease-in-out infinite;
    }

    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spinWheel 2s linear infinite;
      display: inline-block;
    }

    /* Form Fields */
    .brutalist-input-wrapper {
      position: relative;
      width: 100%;
    }
    .brutalist-input-field {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 0.5px solid var(--text-ghost);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 22px;
      color: var(--text-primary);
      padding: 8px 0;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .brutalist-input-field:focus {
      border-bottom: 0.5px solid var(--accent);
    }
    .brutalist-input-field::placeholder {
      color: var(--text-ghost);
    }

    /* Brutalist Buttons (Never filled with accent color) */
    .brutalist-btn {
      width: 100%;
      height: 48px;
      background: transparent;
      border: 0.5px solid var(--text-secondary);
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--text-primary);
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .brutalist-btn:hover, .brutalist-btn:active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Navigation Pinned to bottom of Screens */
    .screen-bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      border-top: 0.5px solid var(--border);
      background-color: rgba(8, 8, 16, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 90;
    }
    .nav-tab-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: 8px;
      letter-spacing: 0.25em;
      color: var(--text-ghost);
      cursor: pointer;
      position: relative;
      text-transform: uppercase;
    }
    .nav-tab-item.active {
      color: var(--accent);
    }
    .nav-tab-active-indicator {
      position: absolute;
      top: -0.5px;
      width: 24px;
      height: 1px;
      background-color: var(--accent);
    }

    /* Lookbook Card in Chat screen */
    .lookbook-card {
      width: 300px;
      border: 0.5px solid var(--border);
      background-color: var(--surface);
      margin-top: 12px;
      display: flex;
      flex-direction: column;
    }
    .lookbook-grid {
      display: flex;
      height: 260px;
      border-bottom: 0.5px solid var(--border);
    }
    .lookbook-left {
      width: 55%;
      height: 100%;
      position: relative;
      background-color: var(--surface-2);
      border-right: 0.5px solid var(--border);
    }
    .lookbook-right {
      width: 45%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .lookbook-right-top {
      height: 50%;
      position: relative;
      background-color: var(--surface-2);
      border-bottom: 0.5px solid var(--border);
    }
    .lookbook-right-bottom {
      height: 50%;
      position: relative;
      background-color: var(--surface-2);
    }
    .glassmorphism-tag {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 8px;
      backdrop-filter: blur(12px);
      background: rgba(8, 8, 16, 0.7);
      border-top: 0.5px solid var(--border);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 9px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lookbook-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Notification dot or alerts styles */
    .alert-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Screen 6 Wardrobe bottom sheet */
    .bottom-sheet-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(8, 8, 16, 0.6);
      z-index: 99;
    }
    .bottom-sheet-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--surface);
      border-top: 0.5px solid var(--border);
      padding: 16px 24px 24px 24px;
      z-index: 100;
    }
    .bottom-sheet-handle {
      width: 32px;
      height: 1px;
      background-color: var(--border-strong);
      margin: 0 auto 16px auto;
    }
  </style>
</head>
<body>

  <!-- React Root Element -->
  <div id="root" class="app-viewport-container"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Direct Web API integration helper
    const api = {
      email: localStorage.getItem('active_email') || 'ramtejyaga@gmail.com',
      setEmail(newEmail) {
        this.email = newEmail;
        localStorage.setItem('active_email', newEmail);
      },
      getHeaders() {
        return {
          'Content-Type': 'application/json',
          'X-User-Email': this.email
        };
      },
      async checkProfile() {
        try {
          const res = await fetch('/user', { headers: this.getHeaders() });
          return res.ok;
        } catch {
          return false;
        }
      },
      async getProfile() {
        const res = await fetch('/user', { headers: this.getHeaders() });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async saveProfile(profile) {
        const res = await fetch('/user', {
          method: 'POST',
          headers: this.getHeaders(),
          body: JSON.stringify(profile)
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async getItems() {
        const res = await fetch('/items', { headers: this.getHeaders() });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async addItem(item) {
        const res = await fetch('/items', {
          method: 'POST',
          headers: this.getHeaders(),
          body: JSON.stringify(item)
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async deleteItem(itemId) {
        const res = await fetch(`/items/${itemId}`, {
          method: 'DELETE',
          headers: this.getHeaders()
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async uploadImage(file) {
        const formData = new FormData();
        formData.append('file', file);
        const res = await fetch('/items/upload', {
          method: 'POST',
          headers: { 'X-User-Email': this.email },
          body: formData
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async analyzeImage(file) {
        const formData = new FormData();
        formData.append('file', file);
        const res = await fetch('/items/analyze', {
          method: 'POST',
          headers: { 'X-User-Email': this.email },
          body: formData
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async getAnalytics() {
        const res = await fetch('/wardrobe/analytics', { headers: this.getHeaders() });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
      async chatStylist(message, history) {
        const res = await fetch('/recommend/chat', {
          method: 'POST',
          headers: this.getHeaders(),
          body: JSON.stringify({ message, history })
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }
    };

    // Default Fallback / Mock Wardrobe Data for offline display
    const defaultWardrobeItems = [
      { id: 'C001', name: 'WHITE OXFORD', category: 'Shirts', color: 'White', fit: 'SLIM FIT', description: 'Oxford cotton slim shirt with button-down collar.', image_path: 'https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=400&auto=format&fit=crop&q=60' },
      { id: 'C002', name: 'NAVY CHINOS', category: 'Pants', color: 'Navy', fit: 'REGULAR FIT', description: 'Medium weight cotton twill tailored trousers.', image_path: 'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400&auto=format&fit=crop&q=60' },
      { id: 'C003', name: 'BLACK DERBY SHOES', category: 'Shoes', color: 'Black', fit: 'REGULAR FIT', description: 'Classic full-grain leather derby shoes with welted sole.', image_path: 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400&auto=format&fit=crop&q=60' },
      { id: 'C004', name: 'GREY WOOL COAT', category: 'Jackets', color: 'Grey', fit: 'OVERSIZED', description: 'Heavyweight felted wool long double-breasted coat.', image_path: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400&auto=format&fit=crop&q=60' },
      { id: 'C005', name: 'BEIGE COTTON KNIT', category: 'Shirts', color: 'Beige', fit: 'RELAXED FIT', description: 'Ribbed collar crewneck knit sweater.', image_path: 'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?w=400&auto=format&fit=crop&q=60' },
      { id: 'C006', name: 'BROWN LEATHER LOAFERS', category: 'Shoes', color: 'Brown', fit: 'REGULAR FIT', description: 'Italian leather penny loafers.', image_path: 'https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=400&auto=format&fit=crop&q=60' },
      { id: 'C007', name: 'SILK BLACK SCARF', category: 'Accessories', color: 'Black', fit: 'REGULAR FIT', description: '100% mulberry silk lightweight neck scarf.', image_path: 'https://images.unsplash.com/photo-1584030373081-f37b7bb4fa8e?w=400&auto=format&fit=crop&q=60' }
    ];

    const defaultProfile = {
      name: 'Ramtej Yaga',
      age: 26,
      gender: 'Male',
      height: 175.0,
      weight: 68.0,
      body_type: 'Inverted Triangle',
      skin_tone: 'Tan',
      undertone: 'Warm',
      hair_color: 'Black',
      face_shape: 'Oval',
      estimated_height: "5'9\""
    };

    function App() {
      // Shared App States
      const [emailInput, setEmailInput] = useState(api.email);
      const [otpCode, setOtpCode] = useState(['', '', '', '', '', '']);
      const [otpStep, setOtpStep] = useState(1); // 1: Email, 2: OTP Box
      const [activeTab, setActiveTab] = useState('HOME'); // Navigation Tab State: HOME, WARDROBE, STYLE, PROFILE
      
      // User Biometrics States (Screen 3)
      const [userHeight, setUserHeight] = useState(170);
      const [userWeight, setUserWeight] = useState(65);
      const [userAge, setUserAge] = useState(25);
      const [userGender, setUserGender] = useState('MALE');

      // Database-synced states
      const [profile, setProfile] = useState(defaultProfile);
      const [wardrobe, setWardrobe] = useState(defaultWardrobeItems);
      const [selectedArchiveItem, setSelectedArchiveItem] = useState(null); // Screen 6 bottom sheet item
      const [archiveFilter, setArchiveFilter] = useState('ALL'); // Screen 6 filter active chip
      
      // Screen 4 Profile Upload Zones & Scanning Overlay Simulation
      const [profilePhotos, setProfilePhotos] = useState({ front: null, side: null, face: null });
      const [isProfileScanning, setIsProfileScanning] = useState(false);
      const [profileScanStep, setProfileScanStep] = useState(0); // logs counter
      const profileLogs = [
        "■ FABRIC TEXTURE MAPPED",
        "■ COLOR PALETTE EXTRACTED",
        "■ CATEGORY CLASSIFIED",
        "■ FIT PROFILE GENERATED"
      ];

      // Screen 7 Stylist Chat states
      const [chatMessages, setChatMessages] = useState([
        { role: 'model', text: 'Good morning, Ramtej. I have curated outfits from your wardrobe archive based on your silhouette. Select a suggestion below or input your requisite.' }
      ]);
      const [chatInputText, setChatInputText] = useState('');
      const [isStylistTyping, setIsStylistTyping] = useState(false);
      const [typingDots, setTypingDots] = useState('');
      const [expandedLookbookId, setExpandedLookbookId] = useState(null);

      // Screen 10 Scanning clothing item state
      const [itemPhoto, setItemPhoto] = useState(null);
      const [isItemScanning, setIsItemScanning] = useState(false);
      const [itemScanStep, setItemScanStep] = useState(0);
      const [detectedItemData, setDetectedItemData] = useState({
        name: 'WHITE OXFORD',
        category: 'SHIRTS',
        color: 'WHITE',
        fit: 'SLIM'
      });
      const [showResultsPanel, setShowResultsPanel] = useState(false);
      const [activeEditField, setActiveEditField] = useState(null);

      // Sync data on email setup/change
      useEffect(() => {
        loadDataFromBackend();
      }, [api.email]);

      // Blink animation helper for active OTP box and loading status
      useEffect(() => {
        const interval = setInterval(() => {
          setTypingDots((prev) => (prev.length >= 3 ? '' : prev + '.'));
        }, 400);
        return () => clearInterval(interval);
      }, []);

      const loadDataFromBackend = async () => {
        try {
          const profileData = await api.getProfile();
          setProfile(profileData);
          setUserHeight(parseInt(profileData.height) || 170);
          setUserWeight(parseInt(profileData.weight) || 65);
          setUserAge(parseInt(profileData.age) || 25);
          setUserGender(profileData.gender ? profileData.gender.toUpperCase() : 'MALE');
        } catch (e) {
          console.log("No backend profile found, using local default", e);
        }

        try {
          const itemsData = await api.getItems();
          if (itemsData && itemsData.items) {
            setWardrobe(itemsData.items);
          }
        } catch (e) {
          console.log("No backend wardrobe found, using local default items", e);
        }
      };

      // OTP Input handler
      const handleOtpChange = (index, value) => {
        if (value.length > 1) return;
        const newOtp = [...otpCode];
        newOtp[index] = value;
        setOtpCode(newOtp);

        // Auto focus next box
        if (value && index < 5) {
          const nextInput = document.getElementById(`otp-box-${index + 1}`);
          if (nextInput) nextInput.focus();
        }
      };

      // Trigger OTP access code simulation
      const triggerOtpSend = () => {
        if (!emailInput.endsWith('@gmail.com')) {
          alert('GMAIL ONLY. Please enter a valid @gmail.com address.');
          return;
        }
        api.setEmail(emailInput);
        setOtpStep(2);
      };

      // Authenticate simulation
      const verifyOtpCode = async () => {
        const fullCode = otpCode.join('');
        if (fullCode.length < 6) return;
        
        // Try creating/syncing user with DB
        try {
          await api.getProfile();
        } catch {
          // If profile missing, register default profile
          try {
            await api.saveProfile({
              name: 'Ramtej Yaga',
              age: userAge,
              gender: userGender,
              height: userHeight,
              weight: userWeight,
              location: 'Hyderabad',
              preferred_style: 'Minimalist Brutalism'
            });
          } catch (e) {
            console.log("Failed to sync profile:", e);
          }
        }
        await loadDataFromBackend();
        alert('AUTHENTICATED SUCCESSFULLY');
        setActiveTab('HOME');
      };

      // Body metrics adjustments
      const updateMetrics = async (field, increment) => {
        let currentAge = userAge;
        let currentHeight = userHeight;
        let currentWeight = userWeight;

        if (field === 'age') {
          currentAge = userAge + increment;
          setUserAge(currentAge);
        } else if (field === 'height') {
          currentHeight = userHeight + increment;
          setUserHeight(currentHeight);
        } else if (field === 'weight') {
          currentWeight = userWeight + increment;
          setUserWeight(currentWeight);
        }

        // Auto sync with database
        try {
          await api.saveProfile({
            name: profile.name || 'Ramtej Yaga',
            age: currentAge,
            gender: userGender,
            height: currentHeight,
            weight: currentWeight,
            location: profile.location || 'Hyderabad',
            body_type: profile.body_type || 'Inverted Triangle',
            skin_tone: profile.skin_tone || 'Tan',
            undertone: profile.undertone || 'Warm',
            face_shape: profile.face_shape || 'Oval',
            estimated_height: `${Math.floor(currentHeight/30.48)}'${Math.round((currentHeight%30.48)/2.54)}"`
          });
          const profileData = await api.getProfile();
          setProfile(profileData);
        } catch (e) {
          console.log("Offline metric updated:", e);
        }
      };

      const selectGender = async (genderVal) => {
        setUserGender(genderVal);
        try {
          await api.saveProfile({
            ...profile,
            gender: genderVal
          });
          const profileData = await api.getProfile();
          setProfile(profileData);
        } catch (e) {
          console.log("Offline gender select:", e);
        }
      };

      // Screen 4 Bio Scanner Trigger
      const runBiometricScan = () => {
        setIsProfileScanning(true);
        setProfileScanStep(0);
        
        let currentStep = 0;
        const interval = setInterval(() => {
          currentStep++;
          setProfileScanStep(currentStep);
          if (currentStep >= 4) {
            clearInterval(interval);
            setIsProfileScanning(false);
            // Autocomplete profile analytics
            setProfile(prev => ({
              ...prev,
              body_type: 'Inverted Triangle',
              skin_tone: 'Tan',
              undertone: 'Warm',
              face_shape: 'Oval'
            }));
            alert("BIOMETRIC ANALYSIS COMPLETE");
          }
        }, 1200);
      };

      // Screen 7 Chat engine
      const sendChatMessage = async (presetText) => {
        const text = presetText || chatInputText;

                  placeholder="STATE YOUR REQUISITE —"
                  className="font-micro-mono"
                  style={{
                    border: 'none',
                    background: 'transparent',
                    color: 'var(--text-primary)',
                    outline: 'none',
                    flex: 1,
                    fontSize: '10px',
                    letterSpacing: '0.2em'
                  }}
                  value={chatInputText}
                  onChange={(e) => setChatInputText(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && sendChatMessage()}
                />
                
                {/* Square Send button */}
                <button
                  onClick={() => sendChatMessage()}
                  style={{
                    width: '36px',
                    height: '36px',
                    border: isStylistTyping ? '0.5px solid var(--accent)' : '0.5px solid var(--text-primary)',
                    background: 'transparent',
                    color: 'var(--text-primary)',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center'
                  }}
                >
                  {isStylistTyping ? (
                    <span className="animate-spin-custom" style={{ color: 'var(--accent)' }}>✦</span>
                  ) : (
                    <span className="font-heading-mono" style={{ fontSize: '14px', textTransform: 'none' }}>↑</span>
                  )}
                </button>
              </div>
            </div>

            {/* Bottom Nav */}
            <div className="screen-bottom-nav">
              {['HOME', 'WARDROBE', 'STYLE', 'PROFILE'].map((tab) => {
                const isActive = activeTab === tab;
                return (
                  <div key={tab} className={`nav-tab-item ${isActive ? 'active' : ''}`} onClick={() => setActiveTab(tab)}>
                    {isActive && <div className="nav-tab-active-indicator"></div>}
                    {tab}
                  </div>
                );
              })}
            </div>
          </div>

          {/* SCREEN 8 — PROFILE DOSSIER */}
          <div className="screen-separator-container">
            <div className="screen-separator-line"></div>
            <div className="screen-separator-label">SCREEN 08 — PROFILE DOSSIER</div>
          </div>
          <div className="mobile-screen-enclosure" style={{ padding: '24px' }}>
            <span className="font-micro-mono" style={{ color: 'var(--text-secondary)', letterSpacing: '0.4em' }}>PROFILE DOSSIER</span>

            {/* Identity Block */}
            <div style={{ border: '0.5px solid var(--border)', backgroundColor: 'var(--surface)', padding: '24px', marginTop: '16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '16px', marginBottom: '20px' }}>
                {/* Monogram Square */}
                <div style={{ width: '52px', height: '52px', border: '0.5px solid var(--border-strong)', backgroundColor: 'var(--surface-2)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <span className="font-heading-mono" style={{ color: 'var(--text-primary)', fontSize: '16px' }}>RY</span>
                </div>
                <div>
                  <div className="font-title-header" style={{ fontSize: '24px', fontWeight: '600' }}>
                    {profile.name}
                  </div>
                  <div className="font-micro-mono" style={{ color: 'var(--text-secondary)', fontSize: '7px', letterSpacing: '0.25em', marginTop: '4px' }}>
                    STYLE PROFILE · {profile.undertone ? profile.undertone.toUpperCase() : 'WARM'} UNDERTONE
                  </div>
                </div>
              </div>

              {/* Confidence Meter */}
              <div style={{ borderTop: '0.5px solid var(--border)', paddingTop: '12px', display: 'flex', justifyContent: 'space-between' }}>
                <span className="font-micro-mono" style={{ color: 'var(--text-secondary)', letterSpacing: '0.2em' }}>BIOMETRIC CONFIDENCE</span>
                <span className="font-micro-mono" style={{ color: 'var(--accent)', fontWeight: '500' }}>HIGH — 94%</span>
              </div>
            </div>

            {/* Biometric Grid */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', marginTop: '24px', border: '0.5px solid var(--border)' }}>
              <div style={{ height: '80px', padding: '16px', borderRight: '0.5px solid var(--border)', borderBottom: '0.5px solid var(--border)', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <span className="font-micro-mono" style={{ color: 'var(--text-secondary)' }}>BODY SHAPE</span>
                <span className="font-caption-text" style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: '18px', color: 'var(--text-primary)' }}>{profile.body_type}</span>
                <span className="font-micro-mono" style={{ color: 'var(--accent)', fontSize: '6px', textAlign: 'right' }}>AI VISION</span>
              </div>
              <div style={{ height: '80px', padding: '16px', borderBottom: '0.5px solid var(--border)', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <span className="font-micro-mono" style={{ color: 'var(--text-secondary)' }}>SKIN TONE</span>
                <span className="font-caption-text" style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: '18px', color: 'var(--text-primary)' }}>{profile.skin_tone} ({profile.undertone})</span>
                <span className="font-micro-mono" style={{ color: 'var(--accent)', fontSize: '6px', textAlign: 'right' }}>AI VISION</span>
              </div>
              <div style={{ height: '80px', padding: '16px', borderRight: '0.5px solid var(--border)', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <span className="font-micro-mono" style={{ color: 'var(--text-secondary)' }}>FACE SHAPE</span>
                <span className="font-caption-text" style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: '18px', color: 'var(--text-primary)' }}>{profile.face_shape}</span>
                <span className="font-micro-mono" style={{ color: 'var(--accent)', fontSize: '6px', textAlign: 'right' }}>AI VISION</span>
              </div>
              <div style={{ height: '80px', padding: '16px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <span className="font-micro-mono" style={{ color: 'var(--text-secondary)' }}>STATURE</span>
                <span className="font-caption-text" style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: '18px', color: 'var(--text-primary)' }}>{profile.estimated_height}</span>
                <span className="font-micro-mono" style={{ color: 'var(--accent)', fontSize: '6px', textAlign: 'right' }}>AI VISION</span>
              </div>
            </div>

            {/* Style matrix label */}
            <div className="font-micro-mono" style={{ color: 'var(--text-ghost)', fontSize: '7px', letterSpacing: '0.4em', textAlign: 'center', margin: '24px 0' }}>
              ── STYLE MATRIX ──
            </div>

            {/* Wardrobe completeness */}
            <div style={{ marginBottom: '32px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                <span className="font-micro-mono" style={{ color: 'var(--text-secondary)' }}>WARDROBE COMPLETENESS</span>
                <span className="font-micro-mono" style={{ color: 'var(--accent)' }}>60%</span>
              </div>
              <div style={{ width: '100%', height: '3px', backgroundColor: 'var(--surface)', position: 'relative' }}>
                <div style={{ width: '60%', height: '3px', backgroundColor: 'var(--accent)' }}></div>
              </div>
            </div>

            <button className="brutalist-btn" onClick={() => alert('EDIT DOSSIER')}>
              EDIT DOSSIER →
            </button>
          </div>

          {/* SCREEN 9 — CLOSET ANALYTICS */}
          <div className="screen-separator-container">
            <div className="screen-separator-line"></div>
            <div className="screen-separator-label">SCREEN 09 — CLOSET ANALYTICS</div>
          </div>
          <div className="mobile-screen-enclosure" style={{ padding: '24px' }}>
            {/* Ghost Background label */}
            <div className="font-title-header" style={{
              position: 'absolute',
              top: '20px',
              right: '-10px',
              fontSize: '96px',
              color: 'var(--surface)',
              opacity: 0.4,
              fontFamily: 'Cormorant Garamond, serif',
              zIndex: 0,
              userSelect: 'none'
            }}>
              METRICS
            </div>

            <div style={{ position: 'relative', zIndex: 1 }}>
              <span className="font-label-mono" style={{ color: 'var(--text-primary)', fontSize: '13px', letterSpacing: '0.25em' }}>CLOSET METRICS</span>
              <div className="font-caption-text" style={{ fontSize: '11px', color: 'var(--text-secondary)', marginTop: '4px', marginBottom: '32px' }}>
                Stylistic breakdown · MongoDB Atlas sync · Last updated 2m ago
              </div>

              {/* Primary Stat Row */}
              <div style={{ display: 'flex', borderTop: '0.5px solid var(--border)', borderBottom: '0.5px solid var(--border)', height: '64px', marginBottom: '32px' }}>
                <div style={{ flex: 1, borderRight: '0.5px solid var(--border)', display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingLeft: '8px' }}>
                  <span style={{ fontFamily: 'Cormorant Garamond, serif', fontWeight: '600', fontSize: '32px', color: 'var(--text-primary)', lineHeight: '1.0' }}>{wardrobe.length}</span>
                  <span className="font-micro-mono" style={{ color: 'var(--text-secondary)', fontSize: '7px', letterSpacing: '0.2em' }}>TOTAL ITEMS</span>
                </div>
                <div style={{ flex: 1, borderRight: '0.5px solid var(--border)', display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingLeft: '8px' }}>
                  <span className="font-label-mono" style={{ fontSize: '16px', color: 'var(--accent)', letterSpacing: '0.1em', lineHeight: '1.2' }}>WHITE</span>
                  <span className="font-micro-mono" style={{ color: 'var(--text-secondary)', fontSize: '7px', letterSpacing: '0.2em' }}>DOMINANT SHADE</span>
                </div>
                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingLeft: '8px' }}>
                  <span style={{ fontFamily: 'Cormorant Garamond, serif', fontWeight: '600', fontSize: '32px', color: 'var(--text-primary)', lineHeight: '1.0' }}>5</span>
                  <span className="font-micro-mono" style={{ color: 'var(--text-secondary)', fontSize: '7px', letterSpacing: '0.2em' }}>CATEGORIES</span>
                </div>
              </div>

              {/* Category list with visual bars */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', marginBottom: '32px' }}>
                {getCategoryBreakdowns().map((row, idx) => (
                  <div key={idx} style={{ height: '44px', display: 'flex', alignItems: 'center', borderBottom: '0.5px solid var(--border)' }}>
                    <span className="font-micro-mono" style={{ width: '80px', color: 'var(--text-primary)', fontSize: '9px', letterSpacing: '0.15em' }}>{row.name}</span>
                    <div style={{ flexGrow: 1, height: '3px', backgroundColor: 'var(--surface-2)', margin: '0 16px', position: 'relative' }}>
                      <div style={{ width: `${row.percentage}%`, height: '3px', backgroundColor: 'var(--accent)' }}></div>
                    </div>
                    <span className="font-micro-mono" style={{ width: '32px', color: 'var(--text-secondary)', fontSize: '9px', textAlign: 'right' }}>{row.count}</span>
                  </div>
                ))}
              </div>

              {/* Color breakdown swatches row */}
              <div>
                <span className="font-micro-mono" style={{ color: 'var(--text-secondary)', fontSize: '7px', letterSpacing: '0.25em', display: 'block', marginBottom: '12px' }}>COLOR BREAKDOWN</span>
                <div style={{ display: 'flex', gap: '4px' }}>
                  {[
                    { color: '#ffffff', name: 'WHITE', pct: '60%' },
                    { color: '#1a2035', name: 'NAVY', pct: '20%' },
                    { color: '#000000', name: 'BLACK', pct: '10%' },
                    { color: '#d5c4a1', name: 'BEIGE', pct: '5%' },
                    { color: '#888888', name: 'GREY', pct: '3%' },
                    { color: '#5c4033', name: 'BROWN', pct: '2%' }
                  ].map((swatch, idx) => (
                    <div key={idx} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: 1 }}>
                      <div style={{
                        width: '28px',
                        height: '28px',
                        backgroundColor: swatch.color,
                        border: '0.5px solid var(--border-strong)',
                        borderRadius: '0px'
                      }}></div>
                      <span className="font-micro-mono" style={{ fontSize: '6px', color: 'var(--text-secondary)', marginTop: '4px', transform: 'scale(0.8)' }}>{swatch.name}</span>
                      <span className="font-micro-mono" style={{ fontSize: '6px', color: 'var(--text-ghost)' }}>{swatch.pct}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* SCREEN 10 — SCAN CLOTHING (AI UPLOAD) */}
          <div className="screen-separator-container">
            <div className="screen-separator-line"></div>
            <div className="screen-separator-label">SCREEN 10 — SCAN CLOTHING</div>
          </div>
          <div className="mobile-screen-enclosure" style={{ display: 'flex', flexDirection: 'column' }}>
            {/* Top 62% Image Zone */}
            <div
              onClick={handleImageSelectSimulate}
              style={{
                height: '62%',
                backgroundColor: 'var(--bg)',
                position: 'relative',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                cursor: 'pointer',
                overflow: 'hidden'
              }}
            >
              {itemPhoto ? (
                <React.Fragment>
                  <img src={itemPhoto} style={{ width: '100%', height: '100%', objectFit: 'cover', opacity: isItemScanning ? 0.3 : 1.0 }} />
                  
                  {/* Viewfinder crop brackets */}
                  <div style={{ position: 'absolute', top: '16px', left: '16px', width: '12px', height: '12px', borderLeft: '0.5px solid var(--accent)', borderTop: '0.5px solid var(--accent)' }}></div>
                  <div style={{ position: 'absolute', top: '16px', right: '16px', width: '12px', height: '12px', borderRight: '0.5px solid var(--accent)', borderTop: '0.5px solid var(--accent)' }}></div>
                  <div style={{ position: 'absolute', bottom: '16px', left: '16px', width: '12px', height: '12px', borderLeft: '0.5px solid var(--accent)', borderBottom: '0.5px solid var(--accent)' }}></div>
                  <div style={{ position: 'absolute', bottom: '16px', right: '16px', width: '12px', height: '12px', borderRight: '0.5px solid var(--accent)', borderBottom: '0.5px solid var(--accent)' }}></div>
                  
                  {/* Laser line sweeping */}
                  {isItemScanning && <div className="scanning-laser-line" style={{ height: '0.5px' }}></div>}
                </React.Fragment>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                  {/* Centered crosshair */}
                  <div style={{ position: 'relative', width: '14px', height: '14px' }}>
                    <div style={{ position: 'absolute', top: '7px', left: '0', width: '14px', height: '0.5px', backgroundColor: 'var(--border)' }}></div>
                    <div style={{ position: 'absolute', top: '0', left: '7px', width: '0.5px', height: '14px', backgroundColor: 'var(--border)' }}></div>
                  </div>
                  <span className="font-micro-mono" style={{ color: 'var(--text-ghost)', fontSize: '8px', marginTop: '12px', letterSpacing: '0.3em' }}>TAP TO CAPTURE</span>
                </div>
              )}

              {/* Stacked labels */}
              {isItemScanning && (
                <div style={{ position: 'absolute', left: '24px', bottom: '24px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  <span className="font-micro-mono" style={{ color: itemScanStep >= 1 ? 'var(--accent)' : 'var(--text-ghost)', fontSize: '7px' }}>■ FABRIC DETECTED</span>
                  <span className="font-micro-mono" style={{ color: itemScanStep >= 2 ? 'var(--accent)' : 'var(--text-ghost)', fontSize: '7px' }}>■ COLOR EXTRACTED</span>
                  <span className="font-micro-mono" style={{ color: itemScanStep >= 3 ? 'var(--accent)' : 'var(--text-ghost)', fontSize: '7px' }}>■ CATEGORY MAPPED</span>
                  <span className="font-micro-mono" style={{ color: itemScanStep >= 4 ? 'var(--accent)' : 'var(--text-ghost)', fontSize: '7px' }}>■ FIT ANALYSIS</span>
                </div>
              )}
            </div>

            {/* Bottom 38% Results Panel */}
            <div style={{
              height: '38%',
              backgroundColor: 'var(--surface)',
              borderTop: '0.5px solid var(--border)',
              padding: '24px',
              display: 'flex',
              flexDirection: 'column',
              justifyContent: 'space-between'
            }}>
              {showResultsPanel ? (
                <React.Fragment>
                  {/* Attribute list */}
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    {Object.keys(detectedItemData).map((field) => {
                      const isEditing = activeEditField === field;
                      return (
                        <div key={field} style={{ height: '40px', borderBottom: '0.5px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                          <span className="font-micro-mono" style={{ color: 'var(--text-secondary)', fontSize: '7px', letterSpacing: '0.2em' }}>{field.toUpperCase()}</span>
                          
                          {isEditing ? (
                            <input
                              type="text"
                              style={{
                                border: 'none',
                                borderBottom: '0.5px solid var(--accent)',
                                background: 'transparent',
                                color: 'var(--text-primary)',
                                textAlign: 'right',
                                outline: 'none',
                                width: '120px',
                                fontFamily: 'DM Mono, monospace',
                                fontSize: '13px'
                              }}
                              value={detectedItemData[field]}
                              autoFocus
                              onChange={(e) => setDetectedItemData({ ...detectedItemData, [field]: e.target.value.toUpperCase() })}
                              onBlur={() => setActiveEditField(null)}
                              onKeyDown={(e) => e.key === 'Enter' && setActiveEditField(null)}
                            />
                          ) : (
                            <span
                              onClick={() => setActiveEditField(field)}
                              className="font-heading-mono"
                              style={{ fontSize: '13px', color: 'var(--text-primary)', cursor: 'pointer' }}
                            >
                              {detectedItemData[field]}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  <button className="brutalist-btn" style={{ borderColor: 'var(--accent)', color: 'var(--accent)' }} onClick={saveScannedItem}>
                    SAVE TO WARDROBE →
                  </button>
                </React.Fragment>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
                  <span className="font-micro-mono" style={{ color: 'var(--text-ghost)', fontSize: '9px', letterSpacing: '0.25em' }}>WAITING FOR CAPTURE</span>
                </div>
              )}
            </div>
          </div>
        </React.Fragment>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
