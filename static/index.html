<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0f17">
  <title>VESTIA — Intelligent Wardrobe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Manrope:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ============================================================
       VESTIA — minimal wardrobe atelier system
       ============================================================ */
    :root {
      /* Midnight Lavender — Korean muted evening tones */
      --bg: #0d0f17;
      --bg-2: #131628;
      --surface: rgba(240, 238, 255, 0.03);
      --surface-2: rgba(240, 238, 255, 0.055);
      --surface-3: rgba(240, 238, 255, 0.09);
      --line: rgba(226, 222, 250, 0.09);
      --accent-line: rgba(180, 170, 228, 0.38);
      --accent: #a89fd4;
      --accent-2: #e6e3f5;
      --accent-deep: #6e6394;
      --accent-dim: rgba(168, 159, 212, 0.14);
      --text: #eceaf6;
      --text-2: #c8c4dc;
      --muted: #8f8ba5;
      --faint: #4e4a63;
      --green: #8ec3a5;
      --red: #d98b9d;
      --blue: #8fa8d1;
      --violet: #b3a6d8;
      --font-display: 'Fraunces', serif;
      --font-sans: 'Manrope', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --r-lg: 26px;
      --r: 18px;
      --r-sm: 12px;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      --shadow-sage: 0 10px 44px rgba(168, 159, 212, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    *::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 400;
      letter-spacing: -0.012em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    /* ============================================================
       AMBIENT BACKGROUND — soft light only
       ============================================================ */
    .bg-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-glow { position: absolute; border-radius: 50%; filter: blur(120px); }
    .bg-glow.g1 { width: 560px; height: 560px; top: -220px; right: -140px; background: radial-gradient(circle, rgba(168,159,212,0.10), transparent 65%); }
    .bg-glow.g2 { width: 640px; height: 640px; bottom: -300px; left: -200px; background: radial-gradient(circle, rgba(110,99,148,0.11), transparent 65%); }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .site { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 28px; }
    .screen { padding: 34px 0 90px; animation: screenIn 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes screenIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* ---------- Top nav ---------- */
    .topnav {
      position: sticky; top: 0; z-index: 80;
      background: rgba(11, 11, 16, 0.6);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topnav-inner {
      max-width: 1240px; margin: 0 auto; padding: 0 28px;
      height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .brand .wordmark { font-family: var(--font-display); font-size: 19px; letter-spacing: 0.3em; font-weight: 500; }
    .topnav-links { display: flex; gap: 6px; }
    .navlink {
      position: relative; display: inline-flex; align-items: center; gap: 8px;
      background: none; border: none; color: var(--muted); font-family: var(--font-sans);
      font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: color 0.25s;
    }
    .navlink svg { width: 16px; height: 16px; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .navlink:hover { color: var(--text); }
    .navlink:hover svg { transform: translateY(-2px); }
    .navlink::after {
      content: ""; position: absolute; left: 16px; right: 16px; bottom: 4px; height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent); transform: scaleX(0);
      transform-origin: left; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .navlink.on { color: var(--accent); }
    .navlink.on::after, .navlink:hover::after { transform: scaleX(1); }
    .topnav-right { display: flex; align-items: center; gap: 12px; }

    /* ---------- Mobile bottom nav ---------- */
    .bottom-nav { display: none; }

    /* ---------- Typography ---------- */
    .mono-l { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
    .gold-text { background: linear-gradient(120deg, #e6e3f5, #a89fd4 45%, #6e6394); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .h-hero { font-family: var(--font-display); font-weight: 300; font-size: clamp(42px, 6vw, 74px); line-height: 1.02; letter-spacing: -0.03em; }
    .h-title { font-family: var(--font-display); font-weight: 300; font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -0.02em; line-height: 1.08; }

    .rv { opacity: 0; transform: translateY(24px); transition: opacity 0.8s cubic-bezier(0.22,1,0.36,1), transform 0.8s cubic-bezier(0.22,1,0.36,1); }
    .rv.in { opacity: 1; transform: none; }

    /* ---------- Buttons ---------- */
    .btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      font-family: var(--font-sans); font-weight: 600; font-size: 13.5px; letter-spacing: 0.01em;
      color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 14px; padding: 13px 22px; cursor: pointer; overflow: hidden;
      transition: all 0.28s ease; user-select: none; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent-line); background: var(--surface-3); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(230,227,245,0.14) 50%, transparent 70%);
      transform: translateX(-110%); transition: transform 0.6s ease;
    }
    .btn:hover::after { transform: translateX(110%); }
    .btn-gold { background: linear-gradient(135deg, #dcd6ef, #9488cf 60%, #6e6394); color: #15101c; font-weight: 700; border: none; box-shadow: var(--shadow-sage); }
    .btn-gold:hover { filter: brightness(1.06); border: none; }
    .btn-ghost { background: transparent; }
    .btn-danger { background: rgba(232,139,139,0.1); border-color: rgba(232,139,139,0.35); color: var(--red); }
    .btn-icon {
      width: 42px; height: 42px; padding: 0; border-radius: 13px;
      background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.25s ease; flex-shrink: 0;
    }
    .btn-icon:hover { color: var(--accent); border-color: var(--accent-line); transform: translateY(-1px); }
    .btn-icon.accent { color: var(--accent); border-color: var(--accent-line); background: var(--accent-dim); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }

    /* ---------- Inputs ---------- */
    .field input[type="text"], .field input[type="email"], .field input[type="search"] {
      width: 100%; background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 16px; color: var(--text);
      font-family: var(--font-sans); font-size: 14px; outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .field input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-dim); }
    .field input::placeholder { color: var(--faint); }
    .field-label { display: block; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 4px; font-weight: 600; }

    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 50%), rgba(255,255,255,0.12) var(--fill, 50%)); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #eceaf6, #a89fd4); border: 2px solid #15101c; box-shadow: 0 0 0 3px rgba(168,159,212,0.25), 0 4px 14px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s; }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #a89fd4; border: 2px solid #15101c; cursor: pointer; }
    .metric-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .metric-val { font-family: var(--font-display); font-size: 26px; color: var(--accent-2); }
    .metric-unit { font-size: 11px; color: var(--muted); margin-left: 4px; letter-spacing: 0.1em; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; }
    .chip {
      flex-shrink: 0; padding: 8px 15px; border-radius: 999px; font-size: 12px; font-weight: 500;
      color: var(--text-2); background: var(--surface); border: 1px solid var(--line);
      cursor: pointer; transition: all 0.22s ease; white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent-line); transform: translateY(-1px); }
    .chip.on { color: #15101c; background: linear-gradient(135deg, #dcd6ef, #a79bd8); border-color: transparent; font-weight: 700; }
    .chip.sm { padding: 5px 11px; font-size: 10.5px; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
      position: relative; overflow: hidden;
      transition: transform 0.35s ease, border-color 0.35s ease, background 0.35s;
    }
    .card.hoverable:hover { transform: translateY(-3px); border-color: var(--accent-line); background: var(--surface-2); }
    .card.glow::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(240px 130px at var(--mx, 50%) var(--my, 0%), rgba(168,159,212,0.09), transparent 70%);
      opacity: 0; transition: opacity 0.4s;
    }
    .card.glow:hover::before { opacity: 1; }
    .card.pad { padding: 22px; }

    .stat-num { font-family: var(--font-display); font-size: 40px; font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
    .stat-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    /* ---------- Hero ---------- */
    .hero { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 64px; align-items: center; padding: 56px 0 40px; }
    .hero h1 { margin: 22px 0 20px; }
    .hero p.lede { color: var(--text-2); font-size: 16px; line-height: 1.75; max-width: 46ch; }
    .hero-actions { display: flex; gap: 14px; margin-top: 30px; flex-wrap: wrap; }
    .hero-meta { display: flex; gap: 28px; margin-top: 34px; color: var(--muted); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
    .hero-meta b { color: var(--accent-2); font-weight: 600; }
    .hero-card {
      padding: 30px; border-radius: var(--r-lg);
      background: linear-gradient(160deg, rgba(168,159,212,0.09), rgba(255,255,255,0.015) 55%), var(--bg-2);
      border: 1px solid var(--accent-line); position: relative; overflow: hidden;
    }
    .hero-card::after { content: ""; position: absolute; top: -70px; right: -70px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(168,159,212,0.13), transparent 70%); }
    .num-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 22px; }

    /* ---------- Marquee ---------- */
    .marquee { overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; margin: 0 0 46px; }
    .marquee-track { display: inline-flex; white-space: nowrap; animation: marquee 26s linear infinite; }
    .marquee-item { display: inline-flex; align-items: center; gap: 40px; font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--faint); }
    .marquee-item svg { color: var(--accent); opacity: 0.5; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* ---------- Sections ---------- */
    .section { margin-bottom: 56px; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; gap: 20px; }
    .section-head p { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
    .section-head .more { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    /* ---------- Item cards ---------- */
    .item-card { border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); overflow: hidden; cursor: pointer; transition: transform 0.35s ease, border-color 0.35s ease; }
    .item-card:hover { transform: translateY(-5px); border-color: var(--accent-line); }
    .item-img { width: 100%; aspect-ratio: 4 / 4.6; object-fit: cover; display: block; background: linear-gradient(135deg, #191924, #12121b); }
    .item-img.ph { display: flex; align-items: center; justify-content: center; color: var(--faint); }
    .item-body { padding: 13px 14px 15px; }
    .item-name { font-family: var(--font-display); font-size: 15px; font-weight: 400; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ---------- Category bars ---------- */
    .cat-row { display: flex; align-items: center; gap: 14px; padding: 9px 0; }
    .cat-name { width: 92px; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-2); font-weight: 600; }
    .cat-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
    .cat-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #6e6394, #dcd6ef); width: 0; transition: width 1.1s cubic-bezier(0.22,1,0.36,1); }
    .cat-count { font-family: var(--font-display); font-size: 16px; width: 26px; text-align: right; color: var(--accent-2); }

    /* ---------- Chat ---------- */
    .chat-shell { max-width: 820px; margin: 0 auto; }
    .chat { display: flex; flex-direction: column; gap: 16px; min-height: 46vh; }
    .bubble { max-width: 82%; padding: 14px 18px; font-size: 14px; line-height: 1.65; border-radius: 18px; animation: bubbleIn 0.4s cubic-bezier(0.22,1,0.36,1); }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
    .bubble.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; color: var(--text-2); }
    .bubble.ai .who { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 9px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    .bubble.user { align-self: flex-end; background: linear-gradient(135deg, #a89fd4, #7b6fa0); color: #15101c; font-weight: 600; border-bottom-right-radius: 6px; }
    .typing { display: inline-flex; gap: 5px; padding: 14px 18px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: typing 1.2s ease-in-out infinite; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }
    .chat-input-row { display: flex; gap: 10px; margin-top: 18px; }
    .chat-input-wrap { flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; padding: 4px 4px 4px 18px; display: flex; align-items: center; gap: 8px; transition: border-color 0.25s; }
    .chat-input-wrap:focus-within { border-color: var(--accent-line); }
    .chat-input-wrap input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-sans); font-size: 14px; padding: 12px 0; }
    .chat-input-wrap input::placeholder { color: var(--faint); }
    .send-btn { width: 42px; height: 42px; border-radius: 14px; border: none; background: linear-gradient(135deg, #dcd6ef, #a79bd8); color: #15101c; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, filter 0.2s; flex-shrink: 0; }
    .send-btn:hover { transform: translateY(-1px) scale(1.05); filter: brightness(1.08); }
    .send-btn:active { transform: scale(0.92); }

    .lookbook { margin-top: 12px; border-radius: var(--r); overflow: hidden; background: var(--bg-2); border: 1px solid var(--accent-line); }
    .lookbook-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .lookbook-head b { font-family: var(--font-display); font-size: 13.5px; font-weight: 400; letter-spacing: 0.02em; }
    .lookbook-head span { font-size: 8.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
    .lookbook-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
    .lb-slot { border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); text-align: center; }
    .lb-slot img { width: 100%; aspect-ratio: 3 / 3.8; object-fit: cover; display: block; }
    .lb-slot .empty { aspect-ratio: 3 / 3.8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--faint); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; }
    .lb-slot .lb-label { font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); padding: 7px 0; font-weight: 700; }
    .lookbook-reason { padding: 12px 14px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.65; color: var(--muted); }
    .lookbook-reason ul { list-style: none; margin-top: 6px; }
    .lookbook-reason li { padding-left: 16px; position: relative; font-size: 12px; color: var(--text-2); margin: 4px 0; }
    .lookbook-reason li::before { content: "◆"; position: absolute; left: 0; top: 0; font-size: 7px; color: var(--accent); }

    /* ---------- Scan ---------- */
    .scan-view { position: relative; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--accent-line); aspect-ratio: 3 / 3.1; background: linear-gradient(160deg, #12121c, #0b0b11); cursor: pointer; }
    .scan-view img { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; transition: opacity 0.4s; }
    .scan-view.ready img { opacity: 1; }
    .scan-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); }
    .viewfinder { position: absolute; inset: 16px; border: 1px solid rgba(168,159,212,0.4); border-radius: 14px; pointer-events: none; }
    .corner { position: absolute; width: 18px; height: 18px; border: 1.5px solid var(--accent); }
    .c-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
    .c-tr { top: 16px; right: 16px; border-left: none; border-bottom: none; border-top-right-radius: 6px; }
    .c-bl { bottom: 16px; left: 16px; border-right: none; border-top: none; border-bottom-left-radius: 6px; }
    .c-br { bottom: 16px; right: 16px; border-left: none; border-top: none; border-bottom-right-radius: 6px; }
    .laser { position: absolute; left: 22px; right: 22px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--accent-2), transparent); box-shadow: 0 0 14px rgba(230,227,245,0.8); animation: laser 1.6s ease-in-out infinite; }
    @keyframes laser { 0%, 100% { top: 12%; opacity: 0; } 15% { opacity: 1; } 50% { top: 86%; opacity: 1; } 85% { opacity: 1; } }
    .scan-step { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); transition: color 0.3s; }
    .scan-step.done { color: var(--accent); }
    .scan-step .step-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.4; }
    .scan-step.done .step-dot { opacity: 1; box-shadow: 0 0 10px currentColor; }

    /* ---------- Modal / Sheet ---------- */
    .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(5,5,10,0.65); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.3s ease; }

        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { el.classList.add('in'); io.disconnect(); } });
        }, { threshold: 0.1 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return <div ref={ref} className={'rv ' + className} style={{ transitionDelay: delay + 'ms', ...style }}>{children}</div>;
    };

    /* Animated counter */
    const Counter = ({ to, duration = 1200, decimals = 0 }) => {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        let raf;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            io.disconnect();
            const start = performance.now();
            const tick = (t) => {
              const p = Math.min(1, (t - start) / duration);
              const ease = 1 - Math.pow(1 - p, 3);
              setVal(to * ease);
              if (p < 1) raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
          });
        }, { threshold: 0.4 });
        io.observe(el);
        return () => { io.disconnect(); if (raf) cancelAnimationFrame(raf); };
      }, [to, duration]);
      return <span ref={ref}>{val.toFixed(decimals)}</span>;

      }, []);

      /* cursor-follow glow on cards */
      useEffect(() => {
        const onMove = (e) => {
          const cards = document.querySelectorAll('.card.glow, .hero-card, .item-card');
          for (let i = 0; i < cards.length; i++) {
            const r = cards[i].getBoundingClientRect();
            if (r.bottom < -40 || r.top > window.innerHeight + 40) continue;
            cards[i].style.setProperty('--mx', (e.clientX - r.left) + 'px');
            cards[i].style.setProperty('--my', (e.clientY - r.top) + 'px');
          }
        };
        window.addEventListener('mousemove', onMove, { passive: true });
        return () => window.removeEventListener('mousemove', onMove);
      }, []);

      const loadData = useCallback(async (silent) => {
        if (!silent) setLoading(true);
        let ok = false;
        try {
          const [p, items] = await Promise.all([api.getProfile(), api.getItems()]);
          setProfile(p);
          setWardrobe(items.items || []);
          ok = true;
        } catch (e) {
          if (e && e.status === 401) {
            api.clearAuth();
            localStorage.removeItem('aw_authed');
            setConnected(false);
            setLoading(false);
            setFlow('email');
            toast('Session expired — please sign in again', 'err');
            return false;
          }
          try { const p = await api.getProfile(); setProfile(p); } catch (e2) { }
          try { const items = await api.getItems(); setWardrobe(items.items || demoItems); } catch (e3) { }
        }
        setConnected(ok);
        setLoading(false);
        return ok;
      }, []);

      useEffect(() => {
        const t = setTimeout(() => {
          const had = localStorage.getItem('aw_authed');
          if (had && api.email && api.token) { loadData(true); setFlow('main'); }
          else { setFlow('email'); }
        }, 2400);
        return () => clearTimeout(t);
      }, [loadData]);

      /* silent background sync — re-pull wardrobe/profile automatically, no UI */
      useEffect(() => {
        let last = Date.now();
        const sync = () => {
          if (document.visibilityState !== 'visible') return;
          if (Date.now() - last < 15000) return; // at most once per 15s
          last = Date.now();
          if (flow === 'main') loadData(true);
        };
        document.addEventListener('visibilitychange', sync);
        window.addEventListener('focus', sync);
        const iv = setInterval(sync, 120000); // gentle poll every 2 minutes
        return () => {
          document.removeEventListener('visibilitychange', sync);
          window.removeEventListener('focus', sync);
          clearInterval(iv);
        };
      }, [flow, loadData]);

      const hour = new Date().getHours();
      const greeting = hour < 5 ? 'Good evening' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

      const sendOtp = async () => {
        if (!/^[\w.+-]+@gmail\.com$/.test(emailInput)) { toast('Please enter a valid @gmail.com address', 'err'); return; }
        api.setEmail(emailInput);
        try {
          const res = await api.login(emailInput);
          if (res.dev_otp) { setOtp(String(res.dev_otp).split('')); toast('Demo access code ' + res.dev_otp, 'ok'); }
          else toast('Access code sent to ' + emailInput, 'ok');
          setFlow('otp');
        } catch (e) {
          if (e && !e.status) {
            // Backend unreachable — keep the offline showcase usable
            localStorage.setItem('aw_authed', '1');
            setConnected(false);
            setFlow('main');
            toast('Server unreachable — showing the demo archive', 'err');
          } else {
            toast(e.message || 'Could not send access code', 'err');
          }
        }
      };
      const onOtpChange = (i, v) => {
        if (v.length > 1) return;
        const next = [...otp]; next[i] = v; setOtp(next);
        if (v && i < 5) { const el = document.getElementById('otp-' + (i + 1)); if (el) el.focus(); }
        else if (!v && i > 0) { const el = document.getElementById('otp-' + (i - 1)); if (el) el.focus(); }
      };
      const verifyOtp = async () => {
        if (otp.join('').length < 6) { toast('Enter the full 6-digit code', 'err'); return; }
        try {
          const res = await api.verify(emailInput, otp.join(''));
          api.setToken(res.token);
          // After login, always land on the home page.
          localStorage.setItem('aw_authed', '1');
          setTab('home');
          setMessages([]);
          let existing = null;
          try { existing = await api.getProfile(); } catch (e) { existing = null; }
          if (existing && existing.name) {
            setProfile(existing);
          } else {
            // New account: seed a minimal profile so the atelier works immediately.
            const prefix = (emailInput.split('@')[0] || 'Maison').replace(/[._-]+/g, ' ').trim();
            const base = {
              name: prefix ? prefix.replace(/\b\w/g, (c) => c.toUpperCase()) : 'Maison Client',
              age: 26, gender: 'Male', height: 175, weight: 68, location: '', preferred_style: '', budget: ''
            };
            try { await api.saveProfile(base); setProfile(base); } catch (e2) { }
          }
          setFlow('main');
          loadData(true);
        } catch (e) {
          setOtp(['', '', '', '', '', '']);
          toast(e.message || 'Verification failed', 'err');
        }
      };

      /* --- scan clothing --- */
      const scanIvRef = useRef(null);
      const bioIvRef = useRef(null);
      const [scanPhase, setScanPhase] = useState('idle');
      const [scanStep, setScanStep] = useState(0);
      const [scanImg, setScanImg] = useState(null);
      const [detected, setDetected] = useState({ name: '', category: 'Shirt', color: '', fit: '' });
      const [savingScan, setSavingScan] = useState(false);

      const openScan = () => { if (scanIvRef.current) clearInterval(scanIvRef.current); setScanPhase('idle'); setScanStep(0); setScanImg(null); setDetected({ name: '', category: 'Shirt', color: '', fit: '' }); setScanOpen(true); };
      const closeScan = () => { if (scanIvRef.current) clearInterval(scanIvRef.current); setScanOpen(false); };
      const pickScanFile = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        setScanImg(URL.createObjectURL(f));
        setScanPhase('scanning');
        setScanStep(0);
        let s = 0;
        const iv = setInterval(() => {
          s++; setScanStep(s);
          if (s >= 4) { clearInterval(iv); scanIvRef.current = null; runAnalysis(f); }
        }, 700);
        scanIvRef.current = iv;
      };
      const runAnalysis = async (f) => {
        try {
          const res = await api.analyzeImage(f);
          setDetected({
            name: (res.description && res.description.value) ? res.description.value.split(',').slice(0, 3).join(' ').slice(0, 42) : '',
            category: res.category && res.category.value ? res.category.value : 'Shirt',
            color: res.color && res.color.value ? res.color.value : '',
            fit: res.fit && res.fit.value ? res.fit.value : ''
          });
          setScanPhase('result');
        } catch (e) {
          setTimeout(() => {
            setDetected({ name: 'Champagne Silk Shirt', category: 'Shirt', color: 'Beige', fit: 'Relaxed' });
            setScanPhase('result');
          }, 500);
        }
      };
      const saveScanned = async () => {
        if (!detected.name) { toast('Describe the garment to save it', 'err'); return; }
        setSavingScan(true);
        const item = {
          name: detected.name, category: detected.category, color: detected.color || 'Neutral',
          fit: detected.fit ? detected.fit + ' fit' : 'Regular', description: 'AI-analyzed garment from atelier scan.',
          image_path: scanImg || '', date_added: new Date().toISOString().split('T')[0]
        };
        try {
          await api.addItem(item);
          toast('Garment added to wardrobe', 'ok');
          await loadData(true);
        } catch (e) {
          const local = { id: 'C' + String(wardrobe.length + 1).padStart(3, '0'), ...item };
          setWardrobe((w) => [local, ...w]);
          toast('Saved locally (offline mode)', 'info');
        }
        setSavingScan(false);
        closeScan();
        switchTab('wardrobe');
      };

      const [confirmDelete, setConfirmDelete] = useState(null);
      const removeItem = async () => {
        try { await api.deleteItem(confirmDelete.id); toast('Garment removed from archive', 'ok'); }
        catch (e) { toast('Removed locally (offline)', 'info'); }
        setWardrobe((w) => w.filter((x) => x.id !== confirmDelete.id));
        setDetailItem(null); setConfirmDelete(null);
      };

      /* --- chat --- */
      useEffect(() => {
        if (messages.length === 0) {
          setMessages([{ role: 'model', text: greeting.toLowerCase() + ', ' + (profile.name || 'guest').split(' ')[0] + '. I have studied your archive. Tell me the occasion — a dinner, an interview, a beach day — and I will compose the look.' }]);
        }
      }, [profile.name]);
      const sendChat = async (preset) => {
        const text = (preset || chatText).trim();
        if (!text || typing) return;
        const hist = messages.filter((m) => m.text).map((m) => ({ role: m.role === 'user' ? 'user' : 'model', text: m.text }));
        const newMsgs = [...messages, { role: 'user', text }];
        setMessages(newMsgs);
        setChatText('');
        setTyping(true);
        try {
          const res = await api.chatStylist(text, hist);
          setTimeout(() => {
            setMessages((m) => [...m, { role: 'model', text: res.chat_response, recs: res.recommendations || [] }]);
            setTyping(false);
          }, 800);
        } catch (e) {
          setTimeout(() => {
            setMessages((m) => [...m, {
              role: 'model',
              text: 'Here is what I would compose from your archive — ' + (profile.body_type || 'your') + ' silhouettes suit structure, so I leaned into clean lines and tonal contrast.',
              recs: [
                { top: wardrobe[0] || demoItems[0], bottom: wardrobe[1] || demoItems[1], shoes: wardrobe[2] || demoItems[2], reason: '• Tonal ivory-on-obsidian keeps the line unbroken.\n• Structured top balances a tailored bottom.' }
              ]
            }]);
            setTyping(false);
          }, 1200);
        }
      };

      /* --- biometric scan --- */
      const [bioPhotos, setBioPhotos] = useState({ front: null, side: null, face: null });
      const bioFiles = useRef({});
      const [bioPhase, setBioPhase] = useState('idle');
      const [bioStep, setBioStep] = useState(0);
      const [bioResults, setBioResults] = useState(null);
      const pickBio = (slot, e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        bioFiles.current[slot] = f;
        setBioPhotos((p) => ({ ...p, [slot]: URL.createObjectURL(f) }));
        const all = ['front', 'side', 'face'].every((s) => bioFiles.current[s]);
        if (all) {
          setTimeout(() => {
            setBioPhase('scanning'); setBioStep(0);
            let s = 0;
            const iv = setInterval(() => {
              s++; setBioStep(s);
              if (s >= 4) { clearInterval(iv); bioIvRef.current = null; runBioAnalysis(); }
            }, 750);
            bioIvRef.current = iv;
          }, 350);
        }
      };
      const runBioAnalysis = async () => {
        try {
          const res = await api.analyzeProfile(bioFiles.current.front, bioFiles.current.side, bioFiles.current.face);
          setBioResults(res);
        } catch (e) {
          setTimeout(() => {
            setBioResults({
              body_type: { value: demoProfile.body_type, confidence: 0.92 }, body_build: { value: demoProfile.body_build, confidence: 0.88 },
              skin_tone: { value: demoProfile.skin_tone, confidence: 0.9 }, undertone: { value: demoProfile.undertone, confidence: 0.84 },
              hair_color: { value: demoProfile.hair_color, confidence: 0.95 }, face_shape: { value: demoProfile.face_shape, confidence: 0.87 },
              facial_hair: { value: demoProfile.facial_hair, confidence: 0.97 }, estimated_height: { value: demoProfile.estimated_height, confidence: 0.8 }
            });
          }, 600);
        }
        setBioPhase('result');
      };
      const closeBio = () => { if (bioIvRef.current) clearInterval(bioIvRef.current); setBioScanOpen(false); };
      const applyBio = async () => {
        if (!bioResults) return;
        const coord = (k) => (bioResults[k] && bioResults[k].value) || '';
        const merged = { ...profile, body_type: coord('body_type'), body_build: coord('body_build'), skin_tone: coord('skin_tone'), undertone: coord('undertone'), hair_color: coord('hair_color'), face_shape: coord('face_shape'), facial_hair: coord('facial_hair'), estimated_height: coord('estimated_height') };
        setProfile(merged);
        try { await api.saveProfile(merged); toast('Silhouette coordinates sealed', 'ok'); }
        catch (e) { toast('Applied locally (offline)', 'info'); }
        closeBio();
        setBioPhase('idle'); setBioResults(null);
        setBioPhotos({ front: null, side: null, face: null });
      };

      /* --- analytics --- */
      const analytics = useMemo(() => {
        const cats = {};
        const colors = {};
        wardrobe.forEach((it) => {
          const c = it.category || 'Other';
          cats[c] = (cats[c] || 0) + 1;
          if (it.color) colors[it.color] = (colors[it.color] || 0) + 1;
        });
        const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);
        const colorArr = Object.entries(colors).sort((a, b) => b[1] - a[1]);
        return { total: wardrobe.length, entries, topColor: colorArr[0] ? colorArr[0][0] : '—', shades: colorArr.length, topCat: entries[0] ? entries[0][0] : '—' };
      }, [wardrobe]);

      const filtered = useMemo(() => {
        let list = wardrobe;
        if (catFilter !== 'All') list = list.filter((it) => (it.category || '').toLowerCase() === catFilter.toLowerCase());
        if (q.trim()) { const s = q.toLowerCase(); list = list.filter((it) => (it.name + ' ' + (it.color || '') + ' ' + (it.category || '') + ' ' + (it.description || '')).toLowerCase().includes(s)); }
        return list;
      }, [wardrobe, catFilter, q]);

      const maxCat = Math.max(1, ...analytics.entries.map((e) => e[1]));
      const confKeys = [
        ['body_type', 'Body Type'], ['body_build', 'Build'], ['skin_tone', 'Skin Tone'], ['undertone', 'Undertone'],
        ['hair_color', 'Hair'], ['face_shape', 'Face Shape'], ['facial_hair', 'Facial Hair'], ['estimated_height', 'Est. Height']
      ];
      const confVal = (k) => (profile[k] && profile[k] !== 'N/A') ? profile[k] : '—';
      const confScore = (k) => {
        if (k === 'estimated_height') return 0.8;
        return 0.82 + ((k.length + (profile[k] || '').length) % 14) / 100;
      };

      const navTabs = [
        { id: 'home', label: 'Atelier', icon: 'home' },
        { id: 'wardrobe', label: 'Archive', icon: 'closet' },
        { id: 'stylist', label: 'Stylist', icon: 'spark' },
        { id: 'profile', label: 'Dossier', icon: 'user' }
      ];

      /* ============ RENDER: SPLASH ============ */
      if (flow === 'splash') {
        return (
          <div style={{ position: 'relative', zIndex: 1, minHeight: '100dvh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Scene />
            <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24, padding: 32 }}>
              <div className="fade-up" style={{ animationDelay: '1s', textAlign: 'center' }}>
                <Wordmark size={40} />
                <div className="mono-l" style={{ marginTop: 16 }}>Intelligent Wardrobe Atelier</div>
              </div>
            </div>
          </div>
        );
      }

      /* ============ RENDER: AUTH ============ */
      if (flow === 'email' || flow === 'otp') {
        return (
          <div style={{ position: 'relative', zIndex: 1, minHeight: '100dvh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Scene />
            <div style={{ width: '100%', maxWidth: 480, padding: '0 24px' }}>
              {flow === 'email' && (
                <div>
                  <div style={{ marginBottom: 36 }}><Wordmark size={24} /></div>
                  <div className="eyebrow" style={{ marginBottom: 18 }}>Private atelier</div>
                  <h1 className="h-hero" style={{ fontSize: 52 }}>Enter the<br /><span className="gold-text">atelier.</span></h1>
                  <p style={{ color: 'var(--muted)', fontSize: 14.5, lineHeight: 1.7, margin: '20px 0 32px', maxWidth: 400 }}>
                    Sign in with your email to open a private archive of your wardrobe, silhouette and style intelligence.
                  </p>
                  <div className="field">
                    <label className="field-label">Email address</label>
                    <input type="email" value={emailInput} onChange={(e) => setEmailInput(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && sendOtp()}
                      placeholder="you@gmail.com" />
                  </div>
                  <button className="btn btn-gold" style={{ width: '100%', marginTop: 18 }} onClick={sendOtp}>
                    Continue <Icon n="arrowR" size={16} />
                  </button>
                </div>
              )}

              {flow === 'otp' && (
                <div>
                  <div style={{ marginBottom: 36 }}><Wordmark size={24} /></div>
                  <div className="eyebrow" style={{ marginBottom: 18 }}>Verify identity</div>
                  <h1 className="h-hero" style={{ fontSize: 52 }}>Access<br /><span className="gold-text">code.</span></h1>
                  <p style={{ color: 'var(--muted)', fontSize: 14, lineHeight: 1.7, margin: '18px 0 28px' }}>
                    We sent a 6-digit code to <b style={{ color: 'var(--accent-2)', fontWeight: 600 }}>{emailInput}</b>.
                  </p>
                  <div className="flex" style={{ gap: 8, justifyContent: 'space-between' }}>
                    {otp.map((d, i) => (
                      <input key={i} id={'otp-' + i} value={d} aria-label={'Digit ' + (i + 1)}
                        onChange={(e) => onOtpChange(i, e.target.value.replace(/\D/g, ''))}
                        onKeyDown={(e) => e.key === 'Enter' && verifyOtp()}
                        inputMode="numeric"
                        style={{
                          width: 52, height: 60, textAlign: 'center', fontSize: 22, fontFamily: 'var(--font-display)',
                          background: 'var(--surface)', border: '1px solid ' + (d ? 'var(--accent-line)' : 'var(--line)'),
                          borderRadius: 14, color: 'var(--accent-2)', outline: 'none',
                          boxShadow: d ? '0 0 0 3px var(--accent-dim)' : 'none', transition: 'all 0.2s'
                        }} />
                    ))}
                  </div>
                  <button className="btn btn-gold" style={{ width: '100%', marginTop: 22 }} onClick={verifyOtp}>
                    Verify <Icon n="check" size={16} />
                  </button>
                  <button className="btn btn-ghost" style={{ width: '100%', marginTop: 10 }} onClick={() => { setOtp(['', '', '', '', '', '']); setFlow('email'); }}>
                    Change email
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ============ RENDER: MAIN SITE ============ */
      return (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <Scene />
          <ToastHost toasts={toasts} />

          <header className="topnav">
            <div className="topnav-inner">
              <div className="brand" onClick={() => switchTab('home')}>
                <Wordmark size={19} />
              </div>
              <nav className="topnav-links">
                {navTabs.map((t) => (
                  <button key={t.id} className={'navlink ' + (tab === t.id ? 'on' : '')} onClick={() => switchTab(t.id)}>
                    <Icon n={t.icon} /> <span>{t.label}</span>
                  </button>
                ))}
              </nav>
              <div className="topnav-right">
                <div className="avatar" onClick={() => switchTab('profile')} aria-label="Profile">{(profile.name || 'M')[0]}</div>
              </div>
            </div>
          </header>

          <div className="site">
            <main className="screen" key={tab}>

              {/* ========== ATELIER (HOME) ========== */}
              {tab === 'home' && (
                <div>
                  <section className="hero">
                    <div>
                      <Reveal>
                        <span className="eyebrow">Intelligent wardrobe atelier</span>
                        <h1 className="h-hero">Your wardrobe,<br /><span className="gold-text">in perfect order.</span></h1>
                        <p className="lede">
                          {analytics.total === 0
                            ? 'Scan your first garment and Maison begins learning — cataloguing fabric, colour and fit into a living archive of you.'
                            : 'I analyzed your ' + analytics.total + ' pieces across ' + analytics.shades + ' shades. ' + analytics.topColor + ' leads your palette. Ask me to compose a look for any occasion.'}
                        </p>
                      </Reveal>
                      <Reveal delay={120}>
                        <div className="hero-actions">
                          <button className="btn btn-gold" onClick={openScan}><Icon n="camera" size={16} /> Scan garment</button>
                          <button className="btn" onClick={() => switchTab('stylist')}><Icon n="spark" size={16} /> Ask the stylist</button>
                        </div>
                      </Reveal>
                      <Reveal delay={200}>
                        <div className="hero-meta">
                          <span>Profile <b>{connected ? 'synced' : 'demo'}</b></span>
                          <span>Stylist <b>Gemini</b></span>
                          <span>Engine <b>v2</b></span>
                        </div>
                      </Reveal>
                    </div>

                    <Reveal delay={150}>
                      <div className="hero-card glow">
                        <span className="mono-l" style={{ color: 'var(--accent)' }}>The atelier in numbers</span>
                        <div className="num-row">
                          <div>
                            <div className="stat-num gold-text"><Counter to={analytics.total} /></div>
                            <div className="stat-label" style={{ marginTop: 8 }}>Pieces</div>
                          </div>
                          <div>
                            <div className="stat-num gold-text"><Counter to={analytics.shades} /></div>
                            <div className="stat-label" style={{ marginTop: 8 }}>Shades</div>
                          </div>
                          <div>
                            <div className="stat-num gold-text"><Counter to={analytics.entries.length} /></div>
                            <div className="stat-label" style={{ marginTop: 8 }}>Categories</div>
                          </div>
                        </div>
                        <div style={{ marginTop: 6 }}>
                          {analytics.entries.length === 0 && <p style={{ color: 'var(--faint)', fontSize: 12.5, padding: '10px 0' }}>Add garments to reveal your composition.</p>}
                          {analytics.entries.map(([c, n], i) => (
                            <div className="cat-row" key={c}>
                              <span className="cat-name">{c}</span>
                              <div className="cat-track">
                                <div className="cat-fill" ref={(el) => { if (el) setTimeout(() => { el.style.width = (n / maxCat) * 100 + '%'; }, 140 + i * 90); }} style={{ background: catColor(c) }}></div>
                              </div>
                              <span className="cat-count">{n}</span>
                            </div>
                          ))}
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 18, paddingTop: 18, borderTop: '1px solid var(--line)', fontSize: 12, color: 'var(--muted)' }}>
                          <Icon n="palette" size={14} style={{ color: 'var(--accent)' }} /> Dominant shade — <b style={{ color: 'var(--accent-2)', fontWeight: 600, marginLeft: 4 }}>{analytics.topColor}</b>
                        </div>
                      </div>
                    </Reveal>
                  </section>

                  <div className="marquee">
                    <div className="marquee-track">
                      {[0, 1].map((dup) => (
                        <span className="marquee-item" key={dup} style={{ display: 'inline-flex' }}>
                          {['AI Stylist', 'Wardrobe Intelligence', 'Silhouette Scan', 'Couture Analytics', 'Personal Lookbook', 'Fabric Vision'].map((w, i) => (
                            <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 40 }}>
                              <span>{w}</span><Icon n="diamond" size={8} />
                            </span>
                          ))}
                        </span>
                      ))}
                    </div>
                  </div>

                  <section className="section">
                    <div className="section-head">
                      <div>
                        <h2 className="h-title">Recently added</h2>
                        <p>Fresh arrivals, catalogued by vision.</p>
                      </div>
                      <span className="more" onClick={() => switchTab('wardrobe')}>View all <Icon n="chevR" size={12} /></span>
                    </div>
                    <div className="grid-4">
                      {(wardrobe.slice(0, 8).length ? wardrobe.slice(0, 8) : demoItems).map((it, i) => (
                        <Reveal key={it.id} delay={Math.min(i, 7) * 60}>
                          <div className="item-card" onClick={() => setDetailItem(it)}>
                            {it.image_path && it.image_path.indexOf('http') === 0 ? (
                              <img className="item-img" src={it.image_path} alt={it.name} loading="lazy" />
                            ) : (
                              <div className="item-img ph"><Icon n="closet" size={30} /></div>
                            )}
                            <div className="item-body">
                              <div className="item-name">{it.name}</div>
                              <div className="item-meta"><span className="dot" style={{ background: catColor(it.category) }}></span>{it.category} · {it.color || '—'}</div>
                            </div>
                          </div>
                        </Reveal>
                      ))}
                    </div>
                  </section>

                  <section className="section">
                    <div className="section-head">
                      <div>
                        <h2 className="h-title">Insights</h2>
                        <p>Quiet intelligence, computed nightly.</p>
                      </div>
                    </div>
                    <div className="grid-3">
                      {[
                        { icon: 'gem', title: 'Curator\'s note', text: analytics.total >= 5 ? 'A neutral core of ' + analytics.topColor + ' gives you a strong base — layer in one statement piece for evenings.' : 'Build a neutral core of 5+ pieces to unlock match intelligence.' },
                        { icon: 'target', title: 'Fit advisory', text: 'Pair structured tops with relaxed bottoms. Your ' + (profile.body_type || 'silhouette') + ' frame carries it beautifully.' },
                        { icon: 'spark', title: 'Trend signal', text: 'Tonal dressing is leading this season. Your existing ' + (analytics.topColor === '—' ? 'palette' : analytics.topColor.toLowerCase()) + ' tones are already on-message.' }
                      ].map((ins, i) => (
                        <Reveal key={i} delay={i * 90}>
                          <div className="card hoverable glow pad">
                            <div className="flex items-center gap-10" style={{ marginBottom: 12 }}>
                              <div className="btn-icon accent" style={{ width: 38, height: 38 }}><Icon n={ins.icon} size={16} /></div>
                              <span className="mono-l" style={{ fontSize: 9, color: 'var(--accent)' }}>{ins.title}</span>
                            </div>
                            <p style={{ fontSize: 13, color: 'var(--text-2)', lineHeight: 1.65 }}>{ins.text}</p>
                          </div>
                        </Reveal>
                      ))}
                    </div>
                  </section>
                </div>
              )}

              {/* ========== ARCHIVE (WARDROBE) ========== */}
              {tab === 'wardrobe' && (
                <div>
                  <Reveal>
                    <div className="flex items-center between" style={{ marginBottom: 26, gap: 16, flexWrap: 'wrap' }}>
                      <div>
                        <h1 className="h-title">The archive</h1>
                        <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 8 }}>{wardrobe.length} garments catalogued</p>
                      </div>
                      <button className="btn btn-gold" onClick={openScan}><Icon n="camera" size={16} /> Scan garment</button>
                    </div>
                  </Reveal>
                  <Reveal delay={60}>
                    <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap', alignItems: 'center', marginBottom: 8 }}>
                      <div className="field" style={{ flex: '1 1 280px' }}>
                        <div className="flex items-center gap-8" style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 14, padding: '0 15px', transition: 'border-color 0.25s' }} onFocus={(e) => e.currentTarget.style.borderColor = 'var(--accent-line)'} onBlur={(e) => e.currentTarget.style.borderColor = 'var(--line)'}>
                          <Icon n="search" size={16} style={{ color: 'var(--muted)' }} />
                          <input type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search the archive…" style={{ flex: 1, background: 'transparent', border: 'none', outline: 'none', color: 'var(--text)', fontFamily: 'var(--font-sans)', fontSize: 14, padding: '13px 0' }} />
                          {q && <Icon n="x" size={14} style={{ color: 'var(--muted)', cursor: 'pointer' }} onClick={() => setQ('')} />}
                        </div>
                      </div>
                      <div className="chips" style={{ flex: '1 1 auto' }}>
                        {['All', ...CATS].map((c) => (
                          <div key={c} className={'chip ' + (catFilter === c ? 'on' : '')} onClick={() => setCatFilter(c)}>{c}</div>
                        ))}
                      </div>
                    </div>
                  </Reveal>

                  {loading ? (
                    <div className="grid-4" style={{ marginTop: 18 }}>
                      {[1, 2, 3, 4].map((i) => <div key={i} className="shimmer" style={{ height: 240, borderRadius: 18 }}></div>)}
                    </div>
                  ) : filtered.length === 0 ? (
                    <div className="empty-state">
                      <Icon n="closet" size={46} />
                      <h4>{q || catFilter !== 'All' ? 'No matches found' : 'The archive awaits'}</h4>
                      <p>{q || catFilter !== 'All' ? 'Try a different search or category.' : 'Scan your first garment and it will appear here, catalogued and styled.'}</p>
                      <button className="btn btn-gold" onClick={openScan}><Icon n="camera" size={15} /> Scan a garment</button>
                    </div>
                  ) : (
                    <div className="grid-4" style={{ marginTop: 18 }}>
                      {filtered.map((it, i) => (
                        <Reveal key={it.id} delay={Math.min(i, 7) * 55}>
                          <div className="item-card" onClick={() => setDetailItem(it)}>
                            {it.image_path && it.image_path.indexOf('http') === 0 ? (
                              <img className="item-img" src={it.image_path} alt={it.name} loading="lazy" />
                            ) : (
                              <div className="item-img ph"><Icon n="closet" size={34} /></div>
                            )}
                            <div className="item-body">
                              <div className="item-name">{it.name}</div>
                              <div className="item-meta"><span className="dot" style={{ background: catColor(it.category) }}></span>{it.category} · {it.color || '—'}</div>
                            </div>
                          </div>
                        </Reveal>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* ========== STYLIST (CHAT) ========== */}
              {tab === 'stylist' && (
                <div className="chat-shell">
                  <Reveal>
                    <div className="flex items-center between" style={{ marginBottom: 26 }}>
                      <div>
                        <span className="eyebrow">Maison stylist</span>
                        <h1 className="h-title" style={{ marginTop: 14 }}>Compose the look.</h1>
                      </div>
                    </div>
                  </Reveal>

                  <div className="chat">
                    {messages.map((m, i) => (
                      <div key={i}>
                        <div className={'bubble ' + (m.role === 'user' ? 'user' : 'ai')}>
                          {m.role === 'model' && <div className="who"><Icon n="spark" size={10} /> Maison Stylist</div>}
                          {m.text}
                        </div>
                        {m.recs && m.recs.length > 0 && (
                          <div style={{ maxWidth: '86%' }}>
                            {m.recs.map((r, ri) => (
                              <div className="lookbook" key={ri}>
                                <div className="lookbook-head">
                                  <b>Look {String(ri + 1).padStart(2, '0')}</b>
                                  <span>composed for you</span>
                                </div>
                                <div className="lookbook-grid">
                                  {[{ key: 'top', label: 'Top' }, { key: 'bottom', label: 'Bottom' }, { key: 'shoes', label: 'Shoes' }].map((s) => {
                                    const it = r[s.key];
                                    return (
                                      <div className="lb-slot" key={s.key}>
                                        {it && it.image_path && it.image_path.indexOf('http') === 0 ? (
                                          <img src={it.image_path} alt={it.name} />
                                        ) : it ? (
                                          <div className="empty" style={{ background: 'linear-gradient(135deg,#1a1a26,#12121b)' }}><Icon n="closet" size={20} /><span>{it.name}</span></div>
                                        ) : (
                                          <div className="empty"><Icon n="x" size={16} /><span>none</span></div>
                                        )}
                                        <div className="lb-label">{s.label}</div>
                                      </div>
                                    );
                                  })}
                                </div>
                                {r.reason && (
                                  <div className="lookbook-reason">
                                    Why this works
                                    <ul>
                                      {r.reason.split('\n').filter((l) => l.trim()).map((l, li) => <li key={li}>{l.replace(/^[•\-\*]\s*/, '')}</li>)}
                                    </ul>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                    {typing && <div className="bubble ai typing"><i></i><i></i><i></i></div>}
                  </div>

                  <Reveal>
                    <div className="chips" style={{ marginTop: 8 }}>
                      {['Dinner date', 'Job interview', 'Beach day', 'Gym session'].map((p) => (
                        <div key={p} className="chip sm" onClick={() => sendChat('I need a look for a ' + p.toLowerCase())}>{p}</div>
                      ))}
                    </div>
                  </Reveal>

                  <div className="chat-input-row">
                    <div className="chat-input-wrap">
                      <input value={chatText} onChange={(e) => setChatText(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && sendChat()}
                        placeholder="Describe the occasion…" />
                      <button className="send-btn" aria-label="Send message" onClick={() => sendChat()}><Icon n="send" size={16} /></button>
                    </div>
                  </div>
                </div>
              )}

              {/* ========== DOSSIER (PROFILE) ========== */}
              {tab === 'profile' && (
                <div>
                  <Reveal>
                    <div className="flex items-center between" style={{ marginBottom: 26 }}>
                      <div>
                        <h1 className="h-title">Dossier</h1>
                        <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 8 }}>{connected ? 'Synced to atelier' : 'Offline showcase'}</p>
                      </div>
                      <button className="btn btn-ghost" onClick={() => { localStorage.removeItem('aw_authed'); api.clearAuth(); setFlow('email'); }}><Icon n="logout" size={15} /> Sign out</button>
                    </div>
                  </Reveal>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 20 }}>
                    <div>
                      <Reveal delay={60}>
                        <div className="hero-card glow" style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
                          <div className="avatar" style={{ width: 64, height: 64, fontSize: 26 }}>{(profile.name || 'M')[0]}</div>
                          <div style={{ flex: 1 }}>
                            <div className="serif" style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 400 }}>{profile.name || 'Maison Client'}</div>
                            <div className="flex items-center gap-8" style={{ color: 'var(--muted)', fontSize: 12.5, marginTop: 8, flexWrap: 'wrap' }}>
                              <span className="flex items-center gap-8"><Icon n="pin" size={12} /> {profile.location || 'Not set'}</span>
                              <span className="flex items-center gap-8"><Icon n="palette" size={12} /> {profile.preferred_style || 'Minimalist Luxury'}</span>
                            </div>
                          </div>
                        </div>
                      </Reveal>
                      <Reveal delay={100}>
                        <div className="grid-2" style={{ marginTop: 16 }}>
                          {[['Height', (profile.height || '—') + ' cm', 'ruler'], ['Weight', (profile.weight || '—') + ' kg', 'target'], ['Age', profile.age || '—', 'clock'], ['Gender', profile.gender || '—', 'user']].map(([l, v, ic]) => (
                            <div className="card pad" key={l}>
                              <span className="flex items-center gap-8" style={{ color: 'var(--muted)' }}><Icon n={ic} size={13} /><span className="stat-label" style={{ letterSpacing: '0.18em' }}>{l}</span></span>
                              <div className="stat-num" style={{ fontSize: 22, marginTop: 8 }}>{v}</div>
                            </div>
                          ))}
                        </div>
                      </Reveal>
                    </div>

                    <div>
                      <Reveal delay={120}>
                        <div className="card pad">
                          <div className="flex items-center between" style={{ marginBottom: 6 }}>
                            <span className="mono-l">Silhouette coordinates</span>
                            <Icon n="scan" size={16} style={{ color: 'var(--accent)' }} />
                          </div>
                          <p style={{ fontSize: 12.5, color: 'var(--faint)', marginBottom: 8 }}>AI-detected attributes with confidence</p>
                          {confKeys.map(([k, label], i) => (
                            <div className="coord-row" key={k}>
                              <span className="coord-name">{label}</span>
                              <span className="coord-val">{confVal(k)}</span>
                              <div className="coord-track">
                                <div className="coord-fill" ref={(el) => { if (el) setTimeout(() => { el.style.width = (confScore(k) * 100) + '%'; }, 200 + i * 60); }}></div>
                              </div>
                            </div>
                          ))}
                          <button className="btn btn-gold" style={{ width: '100%', marginTop: 18 }} onClick={() => { setBioScanOpen(true); setBioPhase('idle'); setBioResults(null); setBioPhotos({ front: null, side: null, face: null }); }}>
                            <Icon n="scan" size={15} /> Scan my silhouette
                          </button>
                        </div>
                      </Reveal>
                      <Reveal delay={160}>
                        <div className="card pad" style={{ marginTop: 16 }}>
                          <span className="mono-l">Atelier metrics</span>
                          <div className="flex gap-12" style={{ marginTop: 14 }}>
                            <div style={{ flex: 1 }}>
                              <div className="stat-num" style={{ fontSize: 30 }}>{analytics.total}</div>
                              <div className="stat-label" style={{ marginTop: 6 }}>Total pieces</div>
                            </div>
                            <div style={{ flex: 1 }}>
                              <div className="stat-num" style={{ fontSize: 30 }}>{analytics.topCat}</div>
                              <div className="stat-label" style={{ marginTop: 6 }}>Leading category</div>
                            </div>
                          </div>
                          <div style={{ marginTop: 16, fontSize: 12, color: 'var(--muted)', lineHeight: 1.6 }} className="flex gap-8 items-center">
                            <Icon n="shield" size={14} style={{ color: 'var(--green)' }} /> Your data is stored privately per email account.
                          </div>
                        </div>
                      </Reveal>
                    </div>
                  </div>
                </div>
              )}

            </main>

            <footer className="footer">
              <span>© 2026 Maison AI</span>
              <span className="flex items-center gap-8"><Icon n="spark" size={12} /> Styling intelligence by Gemini</span>
            </footer>
          </div>

          {/* Mobile bottom nav */}
          <nav className="bottom-nav">
            {navTabs.map((t) => (
              <button key={t.id} className={'nav-item ' + (tab === t.id ? 'on' : '')} onClick={() => switchTab(t.id)}>
                <Icon n={t.icon} /> <span>{t.label}</span>
              </button>
            ))}
          </nav>

          {/* ---------- ITEM DETAIL SHEET ---------- */}
          {detailItem && (
            <div className="overlay" onClick={() => { setDetailItem(null); setConfirmDelete(null); }}>
              <div className="sheet" onClick={(e) => e.stopPropagation()}>
                {detailItem.image_path && detailItem.image_path.indexOf('http') === 0 ? (
                  <img src={detailItem.image_path} alt={detailItem.name} style={{ width: '100%', aspectRatio: '16 / 10', objectFit: 'cover', borderRadius: 18, border: '1px solid var(--line)' }} />
                ) : (
                  <div className="item-img ph" style={{ width: '100%', aspectRatio: '16 / 10', borderRadius: 18 }}><Icon n="closet" size={40} /></div>
                )}
                <div className="flex items-center between" style={{ marginTop: 18 }}>
                  <div>
                    <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 24, fontWeight: 400 }}>{detailItem.name}</h2>
                    <div className="flex items-center gap-8" style={{ marginTop: 10 }}>
                      <span className="chip sm on">{detailItem.category}</span>
                      <span className="chip sm"><span className="dot" style={{ background: catColor(detailItem.category), display: 'inline-block', marginRight: 6 }}></span>{detailItem.color || 'Neutral'}</span>
                      <span className="chip sm">{detailItem.fit || 'Regular'} fit</span>
                    </div>
                  </div>
                </div>
                <p style={{ color: 'var(--text-2)', fontSize: 13.5, lineHeight: 1.65, marginTop: 14 }}>{detailItem.description || 'No description.'}</p>
                <div className="flex items-center gap-8" style={{ color: 'var(--faint)', fontSize: 12, marginTop: 12 }}>
                  <Icon n="calendar" size={13} /> Added {niceDate(detailItem.date_added)} · Ref {detailItem.id}
                </div>
                <div className="flex gap-10" style={{ marginTop: 22 }}>
                  {confirmDelete ? (
                    <button className="btn btn-danger" style={{ flex: 1 }} onClick={removeItem}><Icon n="check" size={15} /> Confirm removal</button>
                  ) : (
                    <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setConfirmDelete(detailItem)}><Icon n="trash" size={15} /> Remove</button>
                  )}
                  <button className="btn btn-gold" style={{ flex: 1 }} onClick={() => { setDetailItem(null); switchTab('stylist'); }}><Icon n="spark" size={15} /> Style it</button>
                </div>
              </div>
            </div>
          )}

          {/* ---------- CLOTHING SCAN MODAL ---------- */}
          {scanOpen && (
            <div className="overlay" onClick={closeScan}>
              <div className="sheet" style={{ maxWidth: 460 }} onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center between" style={{ marginBottom: 16 }}>
                  <div>
                    <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 400 }}>Scan a garment</h2>
                    <p className="mono-l" style={{ marginTop: 6, fontSize: 9 }}>Vision analysis · fabric · color · fit</p>
                  </div>
                  <button className="btn-icon" aria-label="Close" onClick={closeScan}><Icon n="x" size={16} /></button>
                </div>

                <input type="file" accept="image/*" id="scan-file" className="hidden" onChange={pickScanFile} />
                <label htmlFor="scan-file" style={{ display: 'block', cursor: 'pointer' }}>
                  <div className={'scan-view ' + (scanImg ? 'ready' : '')}>
                    {scanImg && <img src={scanImg} alt="garment" />}
                    <div className="viewfinder"></div>
                    <span className="corner c-tl"></span><span className="corner c-tr"></span><span className="corner c-bl"></span><span className="corner c-br"></span>
                    {scanPhase === 'scanning' && <div className="laser"></div>}
                    {!scanImg && (
                      <div className="scan-placeholder">
                        <div className="btn-icon accent" style={{ width: 66, height: 66, borderRadius: 20 }}><Icon n="camera" size={26} /></div>
                        <div>
                          <div className="mono-l" style={{ color: 'var(--text-2)', fontSize: 9.5 }}>Tap to photograph</div>
                          <div style={{ fontSize: 11, color: 'var(--faint)', marginTop: 5 }}>JPEG, PNG or WEBP</div>
                        </div>
                      </div>
                    )}
                    {scanPhase === 'scanning' && (
                      <div style={{ position: 'absolute', left: 26, bottom: 22 }}>
                        {['Fabric texture mapped', 'Color palette extracted', 'Category classified', 'Fit profile generated'].map((s, i) => (
                          <div key={i} className={'scan-step ' + (scanStep > i ? 'done' : '')}>
                            <span className="step-dot"></span>{s}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </label>

                {scanPhase === 'result' && (
                  <div style={{ marginTop: 16 }}>
                    <label className="field-label">Detected attributes — tap to refine</label>
                    {[['name', 'Name'], ['category', 'Category'], ['color', 'Color'], ['fit', 'Fit']].map(([k, label]) => (
                      <div key={k} className="flex items-center between" style={{ padding: '10px 2px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
                        <span className="mono-l" style={{ fontSize: 9 }}>{label}</span>
                        <input value={detected[k]}
                          onChange={(e) => setDetected({ ...detected, [k]: e.target.value })}
                          style={{ width: '60%', background: 'transparent', border: 'none', borderBottom: '1px solid var(--accent-line)', outline: 'none', color: 'var(--accent-2)', fontFamily: 'var(--font-sans)', fontSize: 13.5, textAlign: 'right', padding: '4px 0' }} />
                      </div>
                    ))}
                    <button className="btn btn-gold" style={{ width: '100%', marginTop: 18 }} onClick={saveScanned} disabled={savingScan}>
                      {savingScan ? 'Sealing into archive…' : <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><Icon n="closet" size={15} /> Save to archive</span>}
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ---------- BIOMETRIC SCAN MODAL ---------- */}
          {bioScanOpen && (
            <div className="overlay" onClick={closeBio}>
              <div className="sheet" style={{ maxWidth: 460 }} onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center between" style={{ marginBottom: 16 }}>
                  <div>
                    <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 400 }}>Silhouette scan</h2>
                    <p className="mono-l" style={{ marginTop: 6, fontSize: 9 }}>Body type · undertone · face shape</p>
                  </div>
                  <button className="btn-icon" aria-label="Close" onClick={closeBio}><Icon n="x" size={16} /></button>
                </div>

                {bioPhase !== 'result' ? (
                  <div>
                    <div className="flex gap-10" style={{ marginBottom: 14 }}>
                      {[['front', 'Front'], ['side', 'Side'], ['face', 'Face']].map(([slot, label]) => (
                        <label key={slot} className={'upload-slot ' + (bioPhotos[slot] ? 'filled' : '')}>
                          {bioPhotos[slot] && <img src={bioPhotos[slot]} alt={label} />}
                          {!bioPhotos[slot] && <Icon n="camera" size={20} />}
                          <span className="slot-label">{bioPhotos[slot] ? 'Captured' : label}</span>
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => pickBio(slot, e)} />
                        </label>
                      ))}
                    </div>
                    {bioPhase === 'scanning' ? (
                      <div className="card pad">
                        <div style={{ position: 'relative', height: 2, background: 'rgba(255,255,255,0.08)', borderRadius: 99, marginBottom: 14, overflow: 'hidden' }}>
                          <div className="laser" style={{ position: 'relative', left: 0, right: 0 }}></div>
                        </div>
                        {['Fabric texture mapped', 'Silhouette measured', 'Undertone sampled', 'Profile generated'].map((s, i) => (
                          <div key={i} className={'scan-step ' + (bioStep > i ? 'done' : '')}>
                            <span className="step-dot"></span>{s}
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p style={{ color: 'var(--muted)', fontSize: 13, lineHeight: 1.65 }}>Upload three photos — front, side and face — and Maison will map your silhouette into style coordinates. Scanning starts automatically.</p>
                    )}
                  </div>
                ) : (
                  <div>
                    <div className="flex items-center gap-8" style={{ marginBottom: 10 }}>
                      <Icon n="check" size={16} style={{ color: 'var(--green)' }} />
                      <span className="mono-l" style={{ color: 'var(--accent)' }}>Analysis complete</span>
                    </div>
                    {bioResults && confKeys.map(([k, label], i) => (
                      <div className="coord-row" key={k}>
                        <span className="coord-name">{label}</span>
                        <span className="coord-val">{bioResults[k] && bioResults[k].value}</span>
                        <div className="coord-track">
                          <div className="coord-fill" ref={(el) => { if (el) setTimeout(() => { el.style.width = ((bioResults[k] && bioResults[k].confidence) || 0.8) * 100 + '%'; }, 120 + i * 60); }}></div>
                        </div>
                      </div>
                    ))}
                    <button className="btn btn-gold" style={{ width: '100%', marginTop: 18 }} onClick={applyBio}>
                      <Icon n="shield" size={15} /> Apply to my profile
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
